<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דשבורד צוות · סקר נופי פרת</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3CclipPath id='c'%3E%3Ccircle cx='14' cy='14' r='14'/%3E%3C/clipPath%3E%3Cg clip-path='url(%23c)'%3E%3Crect width='28' height='28' fill='%230E6B5B'/%3E%3Ccircle cx='18.5' cy='9.5' r='4' fill='%23E2A73E'/%3E%3Cpath d='M0 19c5-4 9-3.5 14-1.5s9 1 14-1V28H0z' fill='%23E8D9BC'/%3E%3Cpath d='M0 23c6-3 12-2 17-.5S24 23 28 22v6H0z' fill='%23BF5533'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="utils.js"></script>
  <script src="icons.js"></script>
</head>
<body>

<header class="topbar wide-bar">
  <div class="topbar-in">
    <span class="brand">דשבורד הצוות · נופי פרת</span>
    <div class="spacer"></div>
    <a class="btn btn-ghost btn-sm" href="admin.html">ניהול הסקר</a>
  </div>
</header>

<main class="wrap wide" id="app"></main>

<script>
const D = {
  rows: [], survey: null, raffleCount: 0, respondents: {}, currentTab: 'overview',
  filterDim: '', filter: null,   // פילוח: שאלת פרופיל + ערך נבחר
  identified: 0,                 // כמה עברו את שלב המייל
  compareDim: 'about_age', compareQ: '',   // השוואה בין קבוצות
  openSearch: '', openTopic: '',           // תשובות פתוחות
};

const MIN_GROUP = 5;   // קבוצה קטנה מזה לא נכנסת להשוואות (רעש סטטיסטי)
const GAP_MIN = 0.12;  // פער מינימלי להצגה, כחלק מטווח הסולם (בסולם 1–10: בערך נקודה)
const DIM_LABEL = {
  about_age: 'גיל', about_kids: 'ילדים בבית', about_seniority: 'ותק ביישוב',
  about_housing: 'מגורים', about_gender: 'מגדר', about_aguda: 'חברות באגודה',
};

init();

async function init() {
  const savedPw = sessionStorage.getItem('np_dash_pw');
  if (savedPw) { load(savedPw); } else { renderLogin(); }
}

function renderLogin(err) {
  const pwIn = el('input', { class: 'txt-input', type: 'password', placeholder: 'סיסמת הצוות', 'aria-label': 'סיסמה' });
  pwIn.addEventListener('keydown', e => { if (e.key === 'Enter') load(pwIn.value); });
  const view = el('div', { class: 'card', style: 'max-width:400px; margin:60px auto' },
    el('h2', { class: 'mb' }, 'כניסת צוות'),
    err ? el('p', { class: 'small', style: 'color:var(--danger)' }, err) : null,
    pwIn,
    el('p', { class: 'small muted mt' }, 'הסיסמה נמצאת בטאב "הגדרות" בגיליון.'),
    el('button', { class: 'btn btn-primary btn-block mt', onclick: () => load(pwIn.value) }, 'כניסה')
  );
  document.getElementById('app').replaceChildren(view);
  pwIn.focus();
}

async function load(password) {
  const app = document.getElementById('app');
  app.replaceChildren(el('div', { class: 'center', style: 'padding:80px 0' }, el('div', { class: 'spinner' }), el('p', { class: 'muted' }, 'טוען נתונים…')));
  try {
    if (isLocalMode()) throw new Error('SCRIPT_URL עדיין לא הוגדר ב-config.js');
    const res = await apiPost('getResults', { password }); // POST: הסיסמה לא נכנסת לכתובת
    if (!res.success) { sessionStorage.removeItem('np_dash_pw'); return renderLogin(res.message); }
    sessionStorage.setItem('np_dash_pw', password);
    D.rows = res.rows; D.survey = res.survey; D.raffleCount = res.raffleCount || 0; D.identified = res.identified || 0;
    // מיזוג לפי עונה: תשובה אחרונה גוברת. דילוג (_skipped) נספר בנפרד ולא כמענה
    D.respondents = {};
    D.rows.forEach(r => {
      const p = D.respondents[r.rid] = D.respondents[r.rid] || { chapters: {}, skipped: {}, answers: {}, first: r.ts };
      if (r.ts < p.first) p.first = r.ts;
      const realKeys = Object.keys(r.answers).filter(k => !k.startsWith('_'));
      if (realKeys.length) { p.chapters[r.chapter] = r.ts; delete p.skipped[r.chapter]; }
      else if (r.answers._skipped) p.skipped[r.chapter] = r.ts;
      realKeys.forEach(k => p.answers[k] = r.answers[k]);
    });
    render();
  } catch (e) {
    app.replaceChildren(el('div', { class: 'card center' },
      el('p', { style: 'color:var(--danger)' }, 'שגיאה בטעינה: ' + e.message),
      el('button', { class: 'btn btn-ghost mt', onclick: () => location.reload() }, 'נסו שוב')));
  }
}

// ── פילוח ─────────────────────────────────────────────────

function profileDims() {
  const about = D.survey.chapters.find(c => c.id === 'about');
  return about ? about.questions.filter(q => (q.type === 'radio' || q.type === 'checkbox') && q.opts && q.opts.length) : [];
}

function dimLabel(d) { return DIM_LABEL[d.id] || d.text; }

function inGroup(r, qId, v) {
  const a = r.answers[qId];
  return Array.isArray(a) ? a.includes(v) : a === v;
}

function allRespondents() { return Object.values(D.respondents); }

// העונים שבפילוח הנוכחי (או כולם)
function pool() {
  const all = allRespondents();
  return D.filter ? all.filter(r => inGroup(r, D.filter.q, D.filter.v)) : all;
}

function answersOf(qId, list) {
  return (list || pool())
    .map(r => r.answers[qId])
    .filter(v => v !== undefined && v !== null && v !== '' && !(Array.isArray(v) && !v.length));
}

function chapterRespondents(chId) { return pool().filter(r => r.chapters[chId]).length; }

function chapterSkips(chId) { return pool().filter(r => r.skipped[chId]).length; }

function renderFilter() {
  const dims = profileDims();
  if (!dims.length) return null;
  const all = allRespondents();
  const sel = el('select', {
    class: 'txt-input', style: 'max-width:210px; padding:9px 12px', 'aria-label': 'פילוח לפי',
    onchange: e => { D.filterDim = e.target.value; D.filter = null; render(); }
  },
    el('option', { value: '' }, 'כל העונים'),
    ...dims.map(d => el('option', { value: d.id }, 'לפי ' + dimLabel(d))));
  sel.value = D.filterDim;

  const card = el('div', { class: 'card', style: 'padding:14px 16px' },
    el('div', { style: 'display:flex; align-items:center; gap:10px; flex-wrap:wrap' },
      el('b', {}, 'פילוח'), sel,
      D.filter ? el('span', { class: 'small muted' }, 'מציג ' + pool().length + ' מתוך ' + all.length + ' עונים') : null));

  const d = dims.find(x => x.id === D.filterDim);
  if (d) {
    card.append(el('div', { class: 'pill-tabs', style: 'margin:12px 0 0' },
      ...d.opts.map(v => {
        const n = all.filter(r => inGroup(r, d.id, v)).length;
        const on = !!(D.filter && D.filter.v === v);
        return el('button', { class: 'pill-tab' + (on ? ' sel' : ''), onclick: () => { D.filter = on ? null : { q: d.id, v }; render(); } },
          v, el('span', { style: 'opacity:.7' }, ' ' + n));
      })));
  }
  return card;
}

// ── מסך ראשי ─────────────────────────────────────────────

function render() {
  const list = pool();
  const app = document.getElementById('app');
  const submitted = list.reduce((a, r) => a + Object.keys(r.chapters).length, 0);

  const tabs = el('div', { class: 'pill-tabs nav' });
  const mkTab = (id, ...label) => el('button', {
    class: 'pill-tab' + (D.currentTab === id ? ' sel' : ''),
    onclick: () => { D.currentTab = id; render(); }
  }, ...label);
  tabs.append(mkTab('overview', 'מבט על'), mkTab('compare', 'השוואה בין קבוצות'), mkTab('open', 'תשובות פתוחות'));
  D.survey.chapters.forEach(ch => tabs.append(mkTab(ch.id, icon(ch.icon || 'list-checks'), ch.title)));

  const kids = [
    el('div', { class: 'stat-row', style: 'margin-top:20px' },
      statTile(list.length, D.filter ? 'עונים בפילוח' : 'עונים'),
      statTile(submitted, 'נושאים שנענו'),
      statTile(list.length ? (submitted / list.length).toFixed(1) : '0', 'נושאים לעונה בממוצע'),
      statTile(D.raffleCount, 'נרשמו להגרלה'),
    ),
    renderFilter(),
    tabs,
  ];

  if (D.currentTab === 'overview') kids.push(renderOverview(list));
  else if (D.currentTab === 'compare') kids.push(renderCompare(list));
  else if (D.currentTab === 'open') kids.push(renderOpen(list));
  else {
    const ch = D.survey.chapters.find(c => c.id === D.currentTab);
    if (ch) kids.push(renderChapter(ch, list));
  }

  app.replaceChildren(el('div', { class: 'fade-in' }, ...kids));
}

function statTile(num, lbl) {
  return el('div', { class: 'stat-tile' }, el('div', { class: 'num' }, String(num)), el('div', { class: 'lbl' }, lbl));
}

function renderOverview(list) {
  const wrap = el('div', {});
  if (!list.length) {
    wrap.append(el('div', { class: 'card center muted' }, 'אין עדיין עונים' + (D.filter ? ' בפילוח הזה' : '')));
    return wrap;
  }

  wrap.append(renderFunnel(list));
  wrap.append(el('div', { class: 'dash-grid two' }, renderPace(list), renderHours(list)));
  wrap.append(renderWho(list));
  wrap.append(renderGaps(list));

  // כמה ענו על כל נושא, וכמה סימנו שהוא לא רלוונטי אליהם
  const card = el('div', { class: 'card' }, el('h3', { class: 'mb' }, 'מענה לפי נושא'),
    el('p', { class: 'small muted mb' }, 'הפס: כמה ענו. בצד: כמה סימנו "הנושא לא רלוונטי אליי".'));
  const max = Math.max(1, ...D.survey.chapters.map(ch => chapterRespondents(ch.id)));
  D.survey.chapters.forEach(ch => {
    const n = chapterRespondents(ch.id), sk = chapterSkips(ch.id);
    card.append(el('div', { class: 'bar-row' },
      el('div', {},
        el('div', { class: 'bar-name' }, icon(ch.icon || 'list-checks'), ch.title),
        el('div', { class: 'bar-track' }, el('div', { class: 'bar-fill', style: 'width:' + Math.round((n / max) * 100) + '%' }, String(n)))
      ),
      el('span', { style: 'display:flex; align-items:center; gap:8px' },
        sk ? el('span', { class: 'small muted' }, sk + ' דילגו') : null,
        el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { D.currentTab = ch.id; render(); } }, 'פירוט'))
    ));
  });
  wrap.append(card);

  // ציוני הסולמות הנמוכים/הגבוהים ביותר. מדרגים לפי ציון מנורמל, כדי שסולם 1–7 לא ייראה "נמוך" ליד 1–10
  const scales = [];
  D.survey.chapters.forEach(ch => ch.questions.forEach(q => {
    if (q.type !== 'scale') return;
    const vals = answersOf(q.id, list).map(Number).filter(n => !isNaN(n));
    if (vals.length < 3) return;
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    scales.push({ ch, q, n: vals.length, avg, norm: normScore(avg, q) });
  }));
  scales.sort((a, b) => a.norm - b.norm);
  if (scales.length) {
    const lows = scales.slice(0, 6), highs = scales.slice(-6).reverse();
    wrap.append(
      el('div', { class: 'card' }, el('h3', { class: 'mb' }, 'הציונים הנמוכים ביותר: כאן כואב'), ...lows.map(scaleRow)),
      el('div', { class: 'card' }, el('h3', { class: 'mb' }, 'הציונים הגבוהים ביותר: מה עובד'), ...highs.map(scaleRow))
    );
  }
  const maj = renderMajority(list);
  if (maj) wrap.append(maj);
  return wrap;
}

// קצב מענה: כמה עונים חדשים בכל יום (לפי ההגשה הראשונה שלהם). עוזר לתזמן תזכורות בוואטסאפ
function renderPace(list) {
  const key = ts => {
    const d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };
  const byDay = {};
  list.forEach(r => { const k = key(r.first); byDay[k] = (byDay[k] || 0) + 1; });
  const keys = Object.keys(byDay).sort();
  const days = [];
  for (let d = new Date(keys[0] + 'T12:00:00'), last = new Date(keys[keys.length - 1] + 'T12:00:00'); d <= last; d.setDate(d.getDate() + 1)) days.push(key(d));
  const shown = days.slice(-30);
  const max = Math.max(1, ...shown.map(k => byDay[k] || 0));
  const bars = el('div', { style: 'display:flex; gap:4px; align-items:flex-end; height:112px; direction:ltr' },
    ...shown.map(k => {
      const n = byDay[k] || 0;
      return el('div', { style: 'flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%', title: k + ': ' + n },
        n ? el('div', { style: 'font-size:11px; color:var(--ink-soft)' }, String(n)) : null,
        el('div', { style: 'width:100%; max-width:44px; border-radius:5px 5px 0 0; background:var(--teal); opacity:' + (n ? 1 : .15) + '; height:' + (n ? Math.max(6, (n / max) * 80) : 3) + 'px' }),
        el('div', { class: 'muted', style: 'font-size:10.5px; margin-top:3px; white-space:nowrap' }, k.slice(8) + '/' + k.slice(5, 7)));
    }));
  return el('div', { class: 'card' }, el('h3', { class: 'mb' }, 'קצב מענה'),
    el('p', { class: 'small muted mb' }, 'עונים חדשים בכל יום' + (days.length > 30 ? ' (30 הימים האחרונים)' : '')), bars);
}

// לכל שאלת סולם ולכל ממד בפרופיל: ממוצע לכל קבוצה (רק קבוצות עם 5 עונים לפחות), והפער בין הגבוהה לנמוכה
function gapsFor(list, onlyQ) {
  const out = [];
  const dims = profileDims().filter(d => !D.filter || D.filter.q !== d.id);
  D.survey.chapters.forEach(ch => ch.questions.forEach(q => {
    if (q.type !== 'scale' || (onlyQ && q.id !== onlyQ)) return;
    const lo = q.min || 1, hi = q.max || 10;
    dims.forEach(d => {
      const groups = d.opts.map(v => {
        const nums = list.filter(r => inGroup(r, d.id, v) && r.answers[q.id] !== undefined)
          .map(r => Number(r.answers[q.id])).filter(n => !isNaN(n));
        return { v, n: nums.length, avg: nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : 0 };
      }).filter(g => g.n >= MIN_GROUP);
      if (groups.length < 2) return;
      groups.sort((a, b) => a.avg - b.avg);
      const low = groups[0], high = groups[groups.length - 1];
      out.push({ ch, q, d, low, high, gap: high.avg - low.avg, norm: (high.avg - low.avg) / (hi - lo) });
    });
  }));
  return out.sort((a, b) => b.norm - a.norm);
}

function gapLine(g) {
  return el('div', { class: 'small', style: 'color:var(--ink-soft)' },
    'לפי ' + dimLabel(g.d) + ': ', el('b', {}, g.high.v), ' ' + g.high.avg.toFixed(1) + ' (' + g.high.n + ' עונים) מול ',
    el('b', {}, g.low.v), ' ' + g.low.avg.toFixed(1) + ' (' + g.low.n + ')');
}

function renderGaps(list) {
  const gaps = gapsFor(list).filter(g => g.norm >= GAP_MIN).slice(0, 8);
  const card = el('div', { class: 'card' }, el('h3', { class: 'mb' }, 'פערים בולטים בין קבוצות'));
  if (!gaps.length) {
    card.append(el('p', { class: 'small muted' }, 'יופיע כשיהיו לפחות ' + MIN_GROUP + ' עונים בכל קבוצה (למשל לפי גיל או ותק) ויהיה ביניהן הבדל של ממש.'));
    return card;
  }
  card.append(el('p', { class: 'small muted mb' }, 'איפה קבוצות שונות ביישוב מרגישות אחרת לגבי אותו נושא.'));
  gaps.forEach(g => card.append(el('div', { class: 'bar-row', style: 'padding:9px 0; border-bottom:1px solid var(--line)' },
    el('div', {}, el('div', { class: 'bar-name' }, g.q.text), el('div', { class: 'small muted' }, g.ch.title), gapLine(g)),
    el('span', { class: 'avg-chip avg-low', title: 'הפער בין הקבוצות' }, 'פער ' + g.gap.toFixed(1))
  )));
  return card;
}

function scaleRow(s) {
  return el('div', { class: 'bar-row' },
    el('div', {},
      el('div', { class: 'bar-name' }, s.q.text),
      el('div', { class: 'small muted' }, s.ch.title + ' · ' + s.n + ' תשובות')
    ),
    avgChip(s.avg, s.q)
  );
}

// ציון כחלק מהטווח: 0 = הקצה התחתון, 1 = העליון
function normScore(avg, q) {
  const lo = q.min || 1, hi = q.max || 10;
  return hi > lo ? (avg - lo) / (hi - lo) : 0;
}

// צבע לפי הציון המנורמל (בסולם 1–10: 7 ומעלה ירוק, 5 ומעלה צהוב). בסולם שאינו 1–10 מוצג גם הטווח
function avgChip(avg, q) {
  const n = normScore(avg, q || {});
  const cls = n >= 6 / 9 ? 'avg-good' : n >= 4 / 9 ? 'avg-mid' : 'avg-low';
  const hi = (q && q.max) || 10;
  return el('span', { class: 'avg-chip ' + cls }, avg.toFixed(1) + (hi !== 10 ? '/' + hi : ''));
}

// ── עזרים לניתוחים ───────────────────────────────────────

const PALETTE = ['#0E6B5B', '#BF5533', '#E2A73E', '#6B7A2E', '#8E5A86', '#3F7A93', '#A39B8B', '#4D5A52'];

const pct = (n, of) => (of ? Math.round((n / of) * 100) : 0);

const shortText = (t, n) => { t = String(t || ''); return t.length > n ? t.slice(0, n - 1) + '…' : t; };

function chTitle(id) {
  const ch = D.survey.chapters.find(c => c.id === id);
  return ch ? ch.title : id;
}

// הנושאים בסדר שבו עוברים עליהם בסקר (לפי התחומים), בלי "קצת עליך"
function topicOrder() {
  const cats = (D.survey.meta && D.survey.meta.categories) || [];
  const topics = D.survey.chapters.filter(c => c.id !== 'about');
  const ordered = cats.flatMap(cat => topics.filter(ch => ch.cat === cat.id));
  return ordered.concat(topics.filter(ch => !ordered.includes(ch)));
}

// הנושאים שרלוונטיים לעונה לפי "קצת עליך", כמו בסקר עצמו
function relevantTopics(r) {
  return topicOrder().filter(ch => evalCond(ch.showIf, r.answers));
}

const isDone = (r, chId) => !!(r.chapters[chId] || r.skipped[chId]);

// ── מבט על: משפך ─────────────────────────────────────────

function renderFunnel(list) {
  const hasAbout = D.survey.chapters.some(c => c.id === 'about');
  const stat = list.map(r => {
    const rel = relevantTopics(r);
    return { r, rel, done: rel.filter(ch => isDone(r, ch.id)).length };
  });
  const finished = (s) => s.done === s.rel.length && (!hasAbout || s.r.chapters.about);
  const steps = [];
  if (D.identified && !D.filter) steps.push(['נכנסו עם מייל', D.identified]);
  steps.push(['שמרו נושא אחד לפחות', list.length]);
  if (hasAbout) steps.push(['מילאו "קצת עליך"', list.filter(r => r.chapters.about).length]);
  steps.push(['עברו חצי מהנושאים', stat.filter(s => s.rel.length && s.done >= s.rel.length / 2).length]);
  steps.push(['סיימו הכול', stat.filter(finished).length]);
  const top = Math.max(1, steps[0][1]);

  const card = el('div', { class: 'card' }, el('h3', { class: 'mb' }, 'מהמייל ועד הסוף'));
  steps.forEach(([label, n]) => card.append(el('div', { class: 'funnel-row' },
    el('span', { class: 'f-lbl' }, label),
    el('span', { class: 'f-track' }, el('span', { class: 'f-fill', style: 'width:' + Math.max(2, pct(n, top)) + '%' })),
    el('span', { class: 'f-num' }, String(n), el('small', {}, pct(n, top) + '%')))));

  // איפה עוצרים: אצל מי שלא סיים, הנושא הראשון שלא עבר (לפי הסדר בסקר)
  const stops = {};
  stat.forEach(s => {
    if (finished(s)) return;
    const at = hasAbout && !s.r.chapters.about ? 'about' : (s.rel.find(ch => !isDone(s.r, ch.id)) || {}).id;
    if (at) stops[at] = (stops[at] || 0) + 1;
  });
  const worst = Object.entries(stops).sort((a, b) => b[1] - a[1]).slice(0, 3);
  if (worst.length) {
    card.append(el('p', { class: 'small muted mt' }, 'איפה עוצרים: ',
      ...worst.flatMap(([id, n], i) => [i ? ' · ' : '', el('b', {}, chTitle(id)), ' (' + n + ')'])));
  }
  return card;
}

// ── מבט על: מתי מתחילים ──────────────────────────────────

function renderHours(list) {
  const h = Array(24).fill(0);
  list.forEach(r => { h[new Date(r.first).getHours()]++; });
  const max = Math.max(1, ...h);
  const peak = h.indexOf(Math.max(...h));
  const bars = el('div', { class: 'hours' }, ...h.map((n, i) => el('div', { class: 'h-col', title: i + ':00 · ' + n },
    el('div', { class: 'h-bar', style: 'height:' + (n ? Math.max(5, (n / max) * 74) : 2) + 'px; opacity:' + (n ? 1 : 0.2) }),
    el('div', { class: 'h-lbl' }, i % 3 === 0 ? String(i) : ''))));
  return el('div', { class: 'card' }, el('h3', { class: 'mb' }, 'מתי מתחילים'),
    el('p', { class: 'small muted mb' }, 'לפי השעה שבה כל עונה התחיל. הכי עמוס סביב ' + peak + ':00, שעה טובה לתזכורת.'), bars);
}

// ── מבט על: מי ענה ───────────────────────────────────────
// התפלגות הפרופיל, כדי לראות אם קבוצה ביישוב חסרה בסקר

function renderWho(list) {
  const card = el('div', { class: 'card' }, el('h3', { class: 'mb' }, 'מי ענה'));
  profileDims().forEach(d => {
    const answered = list.filter(r => answersOf(d.id, [r]).length);
    if (!answered.length) return;
    const counts = d.opts.map(v => answered.filter(r => inGroup(r, d.id, v)).length);
    const row = el('div', { class: 'who-row' }, el('div', { class: 'who-lbl' }, dimLabel(d), el('small', {}, answered.length + ' ענו')));
    if (d.type === 'radio') {
      row.append(el('div', { class: 'stack' }, ...d.opts.map((v, i) => counts[i]
        ? el('i', { style: 'width:' + (counts[i] / answered.length) * 100 + '%; background:' + PALETTE[i % PALETTE.length], title: v + ': ' + counts[i] })
        : null)));
    } else {
      // בחירה מרובה (למשל ילדים בבית): כל אפשרות בנפרד, כי אפשר לסמן כמה
      row.append(el('div', { class: 'mini-bars' }, ...d.opts.map((v, i) => el('div', { class: 'mini', title: v + ': ' + counts[i] },
        el('i', { style: 'width:' + pct(counts[i], answered.length) + '%; background:' + PALETTE[i % PALETTE.length] })))));
    }
    row.append(el('div', { class: 'legend' }, ...d.opts.map((v, i) =>
      el('span', { style: '--c:' + PALETTE[i % PALETTE.length] }, v + ' ', el('b', {}, pct(counts[i], answered.length) + '%')))));
    card.append(row);
  });
  return card;
}

// ── מבט על: מה הרוב אומר ─────────────────────────────────
// התשובה המובילה בכל שאלת בחירה. "דעות חלוקות": אין רוב, והשנייה קרובה

function renderMajority(list) {
  const rows = [];
  topicOrder().forEach(ch => ch.questions.forEach(q => {
    if (q.type !== 'radio' && q.type !== 'checkbox') return;
    const vals = answersOf(q.id, list);
    if (vals.length < 3) return;
    const counts = {};
    vals.forEach(v => (Array.isArray(v) ? v : [v]).forEach(o => {
      const k = String(o).startsWith('אחר: ') ? 'אחר' : String(o);
      counts[k] = (counts[k] || 0) + 1;
    }));
    const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    const share = sorted[0][1] / vals.length;
    const second = sorted[1] ? sorted[1][1] / vals.length : 0;
    const split = q.type === 'radio' && share < 0.5 && second >= 0.3;
    rows.push(el('div', { class: 'maj-row' },
      el('div', { class: 'maj-q' }, el('small', {}, ch.title), shortText(q.text, 95)),
      el('div', { class: 'maj-a' },
        el('span', { class: 'maj-lead' }, shortText(sorted[0][0], 42)),
        el('span', { class: 'maj-bar' }, el('i', { style: 'width:' + Math.round(share * 100) + '%' })),
        el('span', { class: 'maj-pct' }, Math.round(share * 100) + '%'),
        split ? el('span', { class: 'tag split' }, 'דעות חלוקות') : null,
        el('small', { class: 'muted' }, vals.length + ' ענו'))));
  }));
  if (!rows.length) return null;
  return el('div', { class: 'card' }, el('h3', { class: 'mb' }, 'מה הרוב אומר'),
    el('p', { class: 'small muted mb' }, 'התשובה המובילה בכל שאלת בחירה. בבחירה מרובה: כמה מהעונים סימנו אותה.'), ...rows);
}

// ── השוואה בין קבוצות ────────────────────────────────────

// לפי מה אפשר להשוות: "קצת עליך", ועוד שאלות בחירה אחת עם עד 6 תשובות (למשל באיזה שער יוצאים)
function compareDims() {
  const others = topicOrder().flatMap(ch => ch.questions
    .filter(q => q.type === 'radio' && q.opts && q.opts.length >= 2 && q.opts.length <= 6)
    .map(q => Object.assign({ chTitle: ch.title }, q)));
  return profileDims().concat(others);
}

function renderCompare(list) {
  const dims = compareDims();
  if (!dims.length) return el('div', { class: 'card muted' }, 'אין שאלות שאפשר להשוות לפיהן');
  if (!dims.some(d => d.id === D.compareDim)) D.compareDim = dims[0].id;
  const d = dims.find(x => x.id === D.compareDim);
  const groups = [{ label: 'כולם', list }].concat(d.opts.map(v => ({ label: v, list: list.filter(r => inGroup(r, d.id, v)) })));

  const sel = el('select', { class: 'txt-input', style: 'max-width:360px', 'aria-label': 'להשוות לפי', onchange: e => { D.compareDim = e.target.value; render(); } },
    el('optgroup', { label: 'קצת עליך' }, ...dims.filter(x => !x.chTitle).map(x => el('option', { value: x.id }, dimLabel(x)))),
    el('optgroup', { label: 'שאלות בסקר' }, ...dims.filter(x => x.chTitle).map(x => el('option', { value: x.id }, x.chTitle + ': ' + shortText(x.text, 55)))));
  sel.value = D.compareDim;

  return el('div', {},
    el('div', { class: 'card', style: 'padding:14px 16px' },
      el('div', { style: 'display:flex; align-items:center; gap:10px; flex-wrap:wrap' }, el('b', {}, 'להשוות לפי'), sel)),
    heatCard(groups),
    choiceCompareCard(groups, d));
}

// מפת חום: כל שאלות הסולם מול הקבוצות. צבע לפי מיקום בטווח הסולם; קבוצה קטנה מעומעמת
function heatCard(groups) {
  const head = el('tr', {}, el('th', {}), ...groups.map(g => el('th', {}, g.label, el('small', {}, g.list.length + ' עונים'))));
  const rows = [];
  topicOrder().forEach(ch => ch.questions.forEach(q => {
    if (q.type !== 'scale') return;
    rows.push(el('tr', {}, el('td', { class: 'lbl' }, shortText(q.text, 64), el('small', {}, ch.title)), ...groups.map(g => heatCell(q, g.list))));
    if (q.dontKnow) rows.push(el('tr', {}, el('td', { class: 'lbl' }, 'ענו "' + DONT_KNOW + '"', el('small', {}, ch.title)), ...groups.map(g => dkCell(q, g.list))));
  }));
  return el('div', { class: 'card' }, el('h3', { class: 'mb' }, 'הסולמות לפי קבוצה'),
    el('p', { class: 'small muted mb' }, 'ממוצע בכל קבוצה: ירוק גבוה, צהוב באמצע, אדום נמוך. מעומעם: פחות מ-' + MIN_GROUP + ' עונים.'),
    el('div', { class: 'tbl-wrap' }, el('table', { class: 'heat' }, el('thead', {}, head), el('tbody', {}, ...rows))));
}

function heatCell(q, list) {
  const nums = answersOf(q.id, list).map(Number).filter(n => !isNaN(n));
  if (!nums.length) return el('td', { class: 'none' }, '·');
  const avg = nums.reduce((a, b) => a + b, 0) / nums.length;
  const n = normScore(avg, q);
  const cls = n >= 6 / 9 ? 'avg-good' : n >= 4 / 9 ? 'avg-mid' : 'avg-low';
  return el('td', { class: cls + (nums.length < MIN_GROUP ? ' few' : ''), title: nums.length + ' עונים' }, avg.toFixed(1));
}

// תא באחוזים: ככל שהאחוז גבוה יותר, הרקע כהה יותר
function pctCell(n, of) {
  if (!of) return el('td', { class: 'none' }, '·');
  const p = n / of;
  return el('td', {
    class: 'pct-cell' + (of < MIN_GROUP ? ' few' : ''), title: n + ' מתוך ' + of,
    style: 'background:rgba(14,107,91,' + (0.05 + 0.6 * p).toFixed(2) + ');' + (p > 0.55 ? 'color:#fff' : ''),
  }, pct(n, of) + '%');
}

function dkCell(q, list) {
  const vals = answersOf(q.id, list);
  return pctCell(vals.filter(v => v === DONT_KNOW).length, vals.length);
}

// שאלת בחירה מול הקבוצות: כמה אחוז מכל קבוצה סימנו כל תשובה
function choiceCompareCard(groups, dim) {
  const qs = topicOrder().flatMap(ch => ch.questions.filter(q => (q.type === 'radio' || q.type === 'checkbox') && q.id !== dim.id).map(q => ({ ch, q })));
  if (!qs.length) return null;
  if (!qs.some(x => x.q.id === D.compareQ)) D.compareQ = qs[0].q.id;
  const { ch, q } = qs.find(x => x.q.id === D.compareQ);
  const sel = el('select', { class: 'txt-input', 'aria-label': 'שאלה', onchange: e => { D.compareQ = e.target.value; render(); } },
    ...topicOrder().map(c => {
      const items = qs.filter(x => x.ch === c);
      return items.length ? el('optgroup', { label: c.title }, ...items.map(x => el('option', { value: x.q.id }, shortText(x.q.text, 75)))) : null;
    }));
  sel.value = D.compareQ;
  const opts = (q.opts || []).concat(q.other ? ['אחר'] : []);
  const chose = (v, o) => (Array.isArray(v) ? v : [v]).some(x => (o === 'אחר' ? String(x).startsWith('אחר: ') : x === o));
  const head = el('tr', {}, el('th', {}), ...groups.map(g => el('th', {}, g.label, el('small', {}, answersOf(q.id, g.list).length + ' ענו'))));
  const rows = opts.map(o => el('tr', {}, el('td', { class: 'lbl' }, shortText(o, 60)), ...groups.map(g => {
    const vals = answersOf(q.id, g.list);
    return pctCell(vals.filter(v => chose(v, o)).length, vals.length);
  })));
  return el('div', { class: 'card' }, el('h3', { class: 'mb' }, 'שאלת בחירה לפי קבוצה'), sel,
    el('p', { class: 'small muted mt mb' }, ch.title + (q.type === 'checkbox' ? '. בחירה מרובה: כל שורה נספרת בנפרד.' : '')),
    el('div', { class: 'tbl-wrap' }, el('table', { class: 'heat' }, el('thead', {}, head), el('tbody', {}, ...rows))));
}

// ── תשובות פתוחות: חיפוש ומילים שחוזרות ───────────────────

// כל הטקסט החופשי, כולל "אחר: ..." בשאלות בחירה. בלי שמות מ"קצת עליך"
function openAnswers(list) {
  const out = [];
  topicOrder().forEach(ch => withMore(ch).forEach(q => {
    list.forEach(r => {
      const v = r.answers[q.id];
      if (v === undefined || v === null || v === '') return;
      if (q.type === 'text' || q.type === 'textarea') out.push({ ch, q, t: String(v) });
      else if (q.other) (Array.isArray(v) ? v : [v]).forEach(x => { if (String(x).startsWith('אחר: ') && String(x).length > 5) out.push({ ch, q, t: String(x).slice(5) }); });
    });
  }));
  return out;
}

const STOP_WORDS = new Set(('של את על עם זה זו זאת הוא היא הם הן אני אנחנו אתם אתן יש אין לא כן גם רק כל מה מי איך למה כי אם או אבל כמו ' +
  'יותר פחות מאוד הרבה קצת עוד כבר היה היו יהיה להיות אפשר צריך צריכים צריכה שלא שיש אחד אחת שני שתי יישוב תושבים תושב ' +
  'דבר דברים ממש פעם כדי בין אצל אותו אותה אותם לכם להם לנו שלי שלך שלנו שלהם זמן טוב טובה חושב חושבת נראה עכשיו שהם שזה ' +
  'ליד תודה סקר חשוב').split(' '));

// מילה "ריקה" גם עם תחילית: "ביישוב", "לתושבים"
function isStopWord(w) {
  for (let s = w, i = 0; i < 3; i++) {
    if (STOP_WORDS.has(s)) return true;
    const t = s.replace(/^[והבלמשכ]/, '');
    if (t === s || t.length < 2) break;
    s = t;
  }
  return false;
}

// מילים וצירופים שחוזרים. צירוף קבוע ("בית הכנסת") מחליף את המילים שלו,
// ו"והגינון" נספר כ"גינון" אם גם "גינון" מופיע
function topWords(texts, n) {
  const docs = texts.map(t => (t.toLowerCase().match(/[א-תa-z0-9"״׳']+/g) || []).map(w => w.replace(/["״׳']/g, '')));
  const uni = {}, bi = {};
  docs.forEach(ws => ws.forEach((w, i) => {
    if (w.length >= 3 && !isStopWord(w)) uni[w] = (uni[w] || 0) + 1;
    const prev = ws[i - 1];
    if (prev && prev.length >= 2 && w.length >= 2 && !isStopWord(prev) && !isStopWord(w)) bi[prev + ' ' + w] = (bi[prev + ' ' + w] || 0) + 1;
  }));
  const out = {};
  Object.entries(bi).sort((a, b) => b[1] - a[1]).forEach(([p, c]) => {
    const [a, b] = p.split(' ');
    if (c >= 3 && (uni[a] || 0) >= c * 0.5 && (uni[b] || 0) >= c * 0.5) {
      out[p] = c;
      uni[a] -= c;
      uni[b] -= c;
    }
  });
  Object.keys(uni).forEach(w => {
    let base = w;
    for (let i = 0; i < 2; i++) {
      const s = base.replace(/^[והבלמשכ]/, '');
      if (s !== base && s.length >= 3 && uni[s] !== undefined) base = s; else break;
    }
    out[base] = (out[base] || 0) + uni[w];
  });
  return Object.entries(out).filter(([, c]) => c >= 2).sort((a, b) => b[1] - a[1]).slice(0, n);
}

function highlight(text, term) {
  if (!term) return [text];
  const i = text.toLowerCase().indexOf(term.toLowerCase());
  if (i === -1) return [text];
  return [text.slice(0, i), el('mark', {}, text.slice(i, i + term.length)), ...highlight(text.slice(i + term.length), term)];
}

function renderOpen(list) {
  const all = openAnswers(list);
  const results = el('div', {});
  const count = el('p', { class: 'small muted mt' });
  const chips = el('div', { class: 'pill-tabs', style: 'margin:8px 0 0' });
  const search = el('input', { class: 'txt-input', type: 'search', placeholder: 'חיפוש, למשל: חניה, תאורה, כלבים', 'aria-label': 'חיפוש בתשובות' });
  search.value = D.openSearch;
  const perTopic = topicOrder().map(ch => [ch, all.filter(a => a.ch === ch).length]).filter(([, n]) => n);
  const topicSel = el('select', { class: 'txt-input', 'aria-label': 'נושא' },
    el('option', { value: '' }, 'כל הנושאים (' + all.length + ')'),
    ...perTopic.map(([ch, n]) => el('option', { value: ch.id }, ch.title + ' (' + n + ')')));
  topicSel.value = D.openTopic;
  const scope = () => (D.openTopic ? all.filter(a => a.ch.id === D.openTopic) : all);

  const drawChips = () => chips.replaceChildren(...topWords(scope().map(a => a.t), 18).map(([w, n]) =>
    el('button', { class: 'pill-tab' + (D.openSearch === w ? ' sel' : ''), onclick: () => { D.openSearch = D.openSearch === w ? '' : w; search.value = D.openSearch; drawChips(); drawResults(); } },
      w, el('span', { style: 'opacity:.7' }, ' ' + n))));

  const drawResults = () => {
    const term = D.openSearch.trim().toLowerCase();
    const shown = scope().filter(a => !term || a.t.toLowerCase().includes(term));
    count.textContent = shown.length + ' תשובות' + (term ? ' עם "' + D.openSearch.trim() + '"' : '');
    results.replaceChildren();
    let curCh = null, curQ = null, card = null;
    shown.forEach(a => {
      if (a.ch !== curCh) { curCh = a.ch; curQ = null; results.append(el('div', { class: 'chapters-head' }, el('h2', { style: 'font-size:34px' }, icon(a.ch.icon || 'list-checks'), a.ch.title))); }
      if (a.q !== curQ) { curQ = a.q; card = el('div', { class: 'card' }, el('p', { class: 'q-text mb' }, a.q.text)); results.append(card); }
      card.append(el('div', { class: 'open-answer' }, ...highlight(a.t, D.openSearch.trim())));
    });
    if (!shown.length) results.append(el('div', { class: 'card center muted' }, term ? 'אין תשובות עם "' + D.openSearch.trim() + '"' : 'אין עדיין תשובות פתוחות'));
  };

  search.addEventListener('input', () => { D.openSearch = search.value; drawChips(); drawResults(); });
  topicSel.addEventListener('change', () => { D.openTopic = topicSel.value; drawChips(); drawResults(); });
  drawChips();
  drawResults();
  return el('div', {},
    el('div', { class: 'card' },
      el('div', { class: 'open-controls' }, search, topicSel),
      el('p', { class: 'small muted mt' }, 'מילים שחוזרות (לחיצה מחפשת):'), chips, count),
    results);
}

// ── נושא בודד ────────────────────────────────────────────

function renderChapter(ch, list) {
  const wrap = el('div', {});
  const sk = chapterSkips(ch.id);
  wrap.append(el('div', { class: 'chapters-head' },
    el('h2', {}, icon(ch.icon || 'list-checks'), ch.title),
    el('p', {}, chapterRespondents(ch.id) + ' עונים ענו על הנושא' + (sk ? ', ' + sk + ' סימנו שהוא לא רלוונטי אליהם' : ''))
  ));

  withMore(ch).forEach(q => {
    const vals = answersOf(q.id, list);
    const card = el('div', { class: 'card' },
      el('p', { class: 'q-text' }, q.text),
      el('p', { class: 'small muted mb' }, vals.length + ' תשובות')
    );
    if (!vals.length) { card.append(el('p', { class: 'muted small' }, 'אין תשובות עדיין')); wrap.append(card); return; }

    if (q.type === 'scale' || q.type === 'number') {
      const nums = vals.map(Number).filter(n => !isNaN(n));
      const dk = vals.length - nums.length; // "לא יודע/ת" לא נכנס לממוצע
      const avg = nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : 0;
      if (nums.length) card.append(el('div', { class: 'mb' },
        q.type === 'scale' ? avgChip(avg, q) : el('span', { class: 'avg-chip avg-mid' }, avg.toFixed(1)),
        el('span', { class: 'small muted' }, '  ממוצע')));
      if (dk) card.append(el('p', { class: 'small muted mb' }, DONT_KNOW + ': ' + dk));
      if (q.type === 'scale' && nums.length) {
        const hist = {};
        nums.forEach(n => hist[n] = (hist[n] || 0) + 1);
        const maxH = Math.max(...Object.values(hist));
        const histWrap = el('div', { style: 'display:flex; gap:4px; align-items:flex-end; height:70px' });
        for (let v = q.min || 1; v <= (q.max || 10); v++) {
          const h = hist[v] ? Math.max(8, (hist[v] / maxH) * 60) : 3;
          histWrap.append(el('div', { style: 'flex:1; text-align:center' },
            el('div', { style: 'background:var(--teal); opacity:' + (hist[v] ? '.85' : '.15') + '; border-radius:4px 4px 0 0; height:' + h + 'px', title: hist[v] || 0 }),
            el('div', { class: 'small muted', style: 'font-size:.7rem' }, String(v))
          ));
        }
        card.append(histWrap);
        card.append(el('div', { class: 'scale-labels' }, el('span', {}, q.minLabel || ''), el('span', {}, q.maxLabel || '')));
        // הפער הכי גדול בשאלה הזו בין קבוצות
        const g = gapsFor(list, q.id)[0];
        if (g && g.norm >= GAP_MIN) card.append(el('div', { class: 'mt', style: 'background:var(--paper); border-radius:12px; padding:10px 12px' }, gapLine(g)));
      }
    } else if (q.type === 'radio' || q.type === 'checkbox') {
      const counts = {};
      vals.forEach(v => (Array.isArray(v) ? v : [v]).forEach(o => { counts[String(o)] = (counts[String(o)] || 0) + 1; }));
      const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      const maxC = entries[0][1];
      entries.forEach(([opt, n]) => {
        card.append(el('div', { class: 'bar-row' },
          el('div', {},
            el('div', { class: 'bar-name' }, opt),
            el('div', { class: 'bar-track' }, el('div', { class: 'bar-fill', style: 'width:' + Math.round((n / maxC) * 100) + '%' }, String(n)))
          ),
          el('span', { class: 'small muted' }, Math.round((n / vals.length) * 100) + '%')
        ));
      });
    } else if (q.type === 'rank') {
      const sums = {}, ns = {};
      vals.forEach(arr => Array.isArray(arr) && arr.forEach((opt, idx) => {
        sums[opt] = (sums[opt] || 0) + idx + 1;
        ns[opt] = (ns[opt] || 0) + 1;
      }));
      Object.entries(sums)
        .map(([opt, sum]) => [opt, sum / ns[opt]])
        .sort((a, b) => a[1] - b[1])
        .forEach(([opt, avg], i) => {
          card.append(el('div', { class: 'bar-row' },
            el('div', { class: 'bar-name' }, (i + 1) + '. ' + opt),
            el('span', { class: 'small muted' }, 'מיקום ממוצע ' + avg.toFixed(1))
          ));
        });
    } else {
      // טקסט חופשי
      vals.forEach(v => card.append(el('div', { class: 'open-answer' }, String(v))));
    }
    wrap.append(card);
  });
  return wrap;
}
</script>
