<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>תוצאות הסקר · נופי פרת</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3CclipPath id='c'%3E%3Ccircle cx='14' cy='14' r='14'/%3E%3C/clipPath%3E%3Cg clip-path='url(%23c)'%3E%3Crect width='28' height='28' fill='%230E6B5B'/%3E%3Ccircle cx='18.5' cy='9.5' r='4' fill='%23E2A73E'/%3E%3Cpath d='M0 19c5-4 9-3.5 14-1.5s9 1 14-1V28H0z' fill='%23E8D9BC'/%3E%3Cpath d='M0 23c6-3 12-2 17-.5S24 23 28 22v6H0z' fill='%23BF5533'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="utils.js"></script>
  <script src="icons.js"></script>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <span class="brand"><span class="brand-dot"></span> נופי פרת</span>
    <div class="spacer"></div>
    <a class="btn btn-ghost btn-sm" href="index.html">לסקר</a>
  </div>
</header>

<main class="wrap" id="app">
  <div class="center" style="padding:80px 0">
    <div class="spinner"></div>
    <p class="muted">טוען את התוצאות…</p>
  </div>
</main>

<script>
init();

// מה מוצג בזמן הטעינה. תושבים רואים את זה: הומור כן, הבטחות שלא מתקיימות (למשל "מצפינים") לא
const LOAD_STEPS = ['אוספים את התשובות…', 'מחשבים ממוצעים…', 'מסתירים שאלות עם מעט עונים, כדי שאף אחד לא יזוהה…', 'מיישרים את העמודות בגרפים…', 'מבריקים את הצבעים…'];

async function init() {
  const app = document.getElementById('app');
  app.replaceChildren(loadingSteps(LOAD_STEPS, { slow: SLOW_MSG }));
  try {
    if (isLocalMode()) throw new Error('המערכת עדיין לא חוברה לשרת');
    const res = await apiCall('getPublicReport');
    if (!res.success) throw new Error(res.message);
    render(res.report);
  } catch (e) {
    app.replaceChildren(el('div', { class: 'hero' },
      el('h1', {}, 'תוצאות הסקר'),
      el('p', { class: 'sub mt' }, e.message || 'הדוח עדיין לא פורסם'),
      el('a', { class: 'btn btn-primary mt', href: 'index.html' }, 'לסקר עצמו ←')
    ));
  }
}

function render(report) {
  const app = document.getElementById('app');
  const kids = [
    el('section', { class: 'hero' },
      el('span', { class: 'kicker' }, 'שקיפות מלאה'),
      el('h1', {}, 'תוצאות סקר התושבים'),
      el('p', { class: 'sub' }, report.totalRespondents + ' תושבות ותושבים השתתפו. תודה!'),
    ),
    el('div', { class: 'card tinted small' },
      el('p', {}, 'מטעמי צנעת הפרט מוצגים כאן נתונים מצרפיים בלבד: שאלות עם פחות מ-5 תשובות ותשובות בטקסט חופשי אינן מוצגות.')
    ),
  ];

  report.chapters.forEach(ch => {
    const card = el('div', { class: 'card' },
      el('h3', { style: 'display:flex; align-items:center; gap:8px; margin-bottom:12px; font-size:19px' }, icon(ch.icon || 'list-checks'), ch.title));
    ch.questions.forEach(q => {
      const qWrap = el('div', { class: 'mb', style: 'padding-bottom:12px; border-bottom:1px dashed var(--line)' },
        el('p', { class: 'q-text', style: 'font-size:.98rem' }, q.text),
        el('p', { class: 'small muted' }, q.count + ' תשובות'));

      if (q.type === 'scale') {
        const lo = q.min || 1, hi = q.max || 10;
        const norm = hi > lo ? (q.avg - lo) / (hi - lo) : 0; // צבע לפי מיקום בטווח, גם בסולם 1–7
        if (q.avg !== undefined) qWrap.append(el('div', {},
          el('span', { class: 'avg-chip ' + (norm >= 6 / 9 ? 'avg-good' : norm >= 4 / 9 ? 'avg-mid' : 'avg-low') }, q.avg.toFixed(1)),
          el('span', { class: 'small muted' }, ' ממוצע (' + lo + '–' + hi + ')')));
        if (q.dontKnow) qWrap.append(el('p', { class: 'small muted' }, DONT_KNOW + ': ' + q.dontKnow));
        if (q.hist && Object.keys(q.hist).length) {
          const maxH = Math.max(...Object.values(q.hist));
          const histWrap = el('div', { style: 'display:flex; gap:3px; align-items:flex-end; height:54px; margin-top:8px' });
          for (let v = lo; v <= hi; v++) {
            const n = q.hist[v] || 0;
            histWrap.append(el('div', { style: 'flex:1; text-align:center' },
              el('div', { style: 'background:var(--teal); opacity:' + (n ? '.85' : '.15') + '; border-radius:3px 3px 0 0; height:' + (n ? Math.max(6, (n / maxH) * 46) : 2) + 'px', title: String(n) }),
              el('div', { class: 'muted', style: 'font-size:.62rem' }, String(v))));
          }
          qWrap.append(histWrap,
            el('div', { class: 'scale-labels' }, el('span', {}, q.minLabel || ''), el('span', {}, q.maxLabel || '')));
        }
      } else if (q.counts) {
        const entries = Object.entries(q.counts).sort((a, b) => b[1] - a[1]);
        const maxC = entries.length ? entries[0][1] : 1;
        entries.forEach(([opt, n]) => {
          qWrap.append(el('div', { class: 'bar-row' },
            el('div', {},
              el('div', { class: 'bar-name' }, opt),
              el('div', { class: 'bar-track', style: 'height:20px' },
                el('div', { class: 'bar-fill', style: 'width:' + Math.round((n / maxC) * 100) + '%; font-size:.72rem' }, String(n)))),
            el('span', { class: 'small muted' }, Math.round((n / q.count) * 100) + '%')));
        });
      } else if (q.avgPos) {
        Object.entries(q.avgPos).sort((a, b) => a[1] - b[1]).forEach(([opt, avg], i) => {
          qWrap.append(el('div', { class: 'bar-row' },
            el('div', { class: 'bar-name' }, (i + 1) + '. ' + opt),
            el('span', { class: 'small muted' }, 'מיקום ממוצע ' + avg.toFixed(1))));
        });
      } else if (q.avg !== undefined) {
        qWrap.append(el('p', {}, 'ממוצע: ' + q.avg));
      }
      card.append(qWrap);
    });
    kids.push(card);
  });

  kids.push(el('p', { class: 'center muted small', style: 'margin-top:20px' }, 'ועד ההנהלה ועובדי היישוב · נופי פרת'));
  app.replaceChildren(el('div', { class: 'fade-in' }, ...kids));
}
</script>
</body>
</html>
